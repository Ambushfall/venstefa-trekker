<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Daily budget bars</title>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;600;700&display=swap"
    />
    <style>
      :root {
        --bg: #eef2f4;
        --surface: #fff;
        --ink: #14232b;
        --muted: #5d6f78;
        --bar: #2f7f86;
        --bar-empty: #cfe0e3;
        --red: #d93a3a;
        --line: #d5dde0;
        box-sizing: border-box;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme='light']) {
          --bg: #0f1a1f;
          --surface: #17262d;
          --ink: #e8f0f2;
          --muted: #93a7af;
          --bar: #4fb0b8;
          --bar-empty: #26414a;
          --red: #ff5c5c;
          --line: #2a3d45;
          color-scheme: dark;
        }
      }
      :root[data-theme='dark'] {
        --bg: #0f1a1f;
        --surface: #17262d;
        --ink: #e8f0f2;
        --muted: #93a7af;
        --bar: #4fb0b8;
        --bar-empty: #26414a;
        --red: #ff5c5c;
        --line: #2a3d45;
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font-family: 'Instrument Sans', system-ui, -apple-system, 'Segoe UI',
          sans-serif;
        line-height: 1.45;
      }
      main {
        max-width: 640px;
        margin: 0 auto;
        padding: 20px 16px 32px;
      }
      h1 {
        font-size: 1.5rem;
        margin: 0 0 4px;
        font-weight: 700;
      }
      .sub {
        color: var(--muted);
        margin: 0 0 20px;
      }
      .panel {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 16px;
        margin-bottom: 16px;
      }
      .row {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
      }
      label {
        display: flex;
        flex-direction: column;
        gap: 4px;
        font-size: 0.85rem;
        color: var(--muted);
        flex: 1;
        min-width: 120px;
      }
      input {
        font: inherit;
        font-size: 1rem;
        color: var(--ink);
        background: var(--bg);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 10px;
      }
      input:focus-visible {
        outline: 2px solid var(--bar);
        outline-offset: 1px;
      }
      .spend input {
        font-size: 1.4rem;
        font-weight: 600;
      }
      .perday {
        font-size: 1.05rem;
        margin: 0 0 12px;
      }
      .perday b {
        font-weight: 700;
      }
      .chart {
        display: flex;
        align-items: flex-end;
        gap: 3px;
        height: 200px;
      }
      .col {
        flex: 1;
        height: 100%;
        background: var(--bar);
        border-radius: 3px;
        position: relative;
        overflow: hidden;
      }
      .fill {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        background: var(--red);
        transition: height 0.25s;
      }
      .axis {
        display: flex;
        justify-content: space-between;
        color: var(--muted);
        font-size: 0.8rem;
        margin-top: 6px;
      }
      .result {
        font-size: 1.1rem;
        font-weight: 600;
        margin: 14px 0 0;
      }
      .result.over {
        color: var(--red);
      }
      .legend {
        display: flex;
        gap: 16px;
        color: var(--muted);
        font-size: 0.85rem;
        margin-top: 8px;
      }
      .sw {
        display: inline-block;
        width: 10px;
        height: 10px;
        border-radius: 2px;
        margin-right: 6px;
      }
      .add {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: flex-end;
      }
      .add label {
        margin: 0;
      }
      button {
        font: inherit;
        cursor: pointer;
        border-radius: 8px;
        border: 1px solid var(--line);
        background: var(--bg);
        color: var(--ink);
        padding: 10px 14px;
      }
      button:focus-visible {
        outline: 2px solid var(--bar);
        outline-offset: 1px;
      }
      .primary {
        background: var(--bar);
        border-color: var(--bar);
        color: #fff;
        font-weight: 600;
      }
      #log {
        list-style: none;
        margin: 12px 0 0;
        padding: 0;
        max-height: 220px;
        overflow-y: auto;
      }
      #log li {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 6px 0;
        border-bottom: 1px solid var(--line);
      }
      #log .x {
        padding: 4px 10px;
        font-size: 0.85rem;
        color: var(--muted);
      }
      .foot {
        display: flex;
        justify-content: flex-end;
        margin-top: 12px;
      }
      .note {
        color: var(--muted);
        margin-left: 8px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Daily budget</h1>
      <p class="sub">
        Each bar is one day of your pay cycle. Enter what you spent and the bars
        turn red.
      </p>

      <div class="panel">
        <div class="row">
          <label
            >Income per cycle (€)<input
              id="income"
              type="text"
              inputmode="decimal"
              autocomplete="off"
              value="3400"
          /></label>
          <label
            >Days per cycle<input
              id="days"
              type="number"
              inputmode="numeric"
              min="1"
              max="60"
              value="25"
          /></label>
        </div>
      </div>

      <div class="panel">
        <p class="perday" id="perday"></p>
        <div
          class="chart"
          id="chart"
          role="img"
          aria-label="Daily budget bars"
        ></div>
        <div class="axis"><span>Day 1</span><span id="lastday"></span></div>
        <div class="legend">
          <span><i class="sw" style="background: var(--bar)"></i>Available</span
          ><span><i class="sw" style="background: var(--red)"></i>Spent</span>
        </div>
      </div>

      <div class="panel spend">
        <div class="add">
          <label
            >Amount spent (€)<input
              id="spent"
              type="text"
              inputmode="decimal"
              autocomplete="off"
              enterkeyhint="next"
              placeholder="0"
          /></label>
          <label style="flex: 2"
            >What was it for?<input
              id="note"
              type="text"
              maxlength="60"
              enterkeyhint="done"
              placeholder="e.g. food"
          /></label>
          <button type="button" id="add" class="primary">Add</button>
        </div>
        <p class="result" id="result"></p>
        <ul id="log"></ul>
        <div class="foot"><button type="button" id="reset">Reset</button></div>
      </div>
    </main>
    <script>
      ;(function () {
        var $ = function (id) {
          return document.getElementById(id)
        }
        var eur = new Intl.NumberFormat('de-DE', {
          style: 'currency',
          currency: 'EUR'
        })
        var num = new Intl.NumberFormat('de-DE', { maximumFractionDigits: 1 })
        var KEY = 'daily-budget-v1'
        function p(x) {
          x = String(x).trim().replace(/\s/g, '')
          if (x.indexOf(',') > -1) x = x.replace(/\./g, '').replace(',', '.')
          var v = parseFloat(x)
          return isFinite(v) ? v : NaN
        }
        var entries = []
        function load() {
          try {
            var s = JSON.parse(localStorage.getItem(KEY) || 'null')
            if (s) {
              if (Array.isArray(s.entries))
                entries = s.entries
                  .map(function (n) {
                    return typeof n === 'number' ? { amt: n, note: '' } : n
                  })
                  .filter(function (e) {
                    return e && typeof e.amt === 'number' && isFinite(e.amt)
                  })
              if (s.income) $('income').value = s.income
              if (s.days) $('days').value = s.days
            }
          } catch (e) {}
        }
        function save() {
          try {
            localStorage.setItem(
              KEY,
              JSON.stringify({
                entries: entries,
                income: $('income').value,
                days: $('days').value
              })
            )
          } catch (e) {}
        }
        function renderList() {
          var ul = $('log')
          ul.innerHTML = ''
          entries.forEach(function (e, i) {
            var li = document.createElement('li')
            var s = document.createElement('span')
            var a = document.createElement('b')
            a.textContent = eur.format(e.amt)
            s.appendChild(a)
            if (e.note) {
              var t = document.createElement('span')
              t.className = 'note'
              t.textContent = e.note
              s.appendChild(t)
            }
            var b = document.createElement('button')
            b.type = 'button'
            b.className = 'x'
            b.textContent = 'Remove'
            b.setAttribute('aria-label', 'Remove ' + eur.format(e.amt))
            b.addEventListener('click', function () {
              entries.splice(i, 1)
              render()
            })
            li.appendChild(s)
            li.appendChild(b)
            ul.appendChild(li)
          })
        }
        function add() {
          var v = p($('spent').value)
          if (!isFinite(v) || v <= 0) return
          entries.push({ amt: v, note: $('note').value.trim() })
          $('spent').value = ''
          $('note').value = ''
          render()
          $('spent').focus()
        }
        function render() {
          var income = Math.max(0, p($('income').value) || 0)
          var days = Math.min(
            60,
            Math.max(1, parseInt($('days').value, 10) || 1)
          )
          var spent = entries.reduce(function (a, n) {
            return a + n.amt
          }, 0)
          save()
          renderList()
          var per = income / days,
            used = per > 0 ? spent / per : 0
          $('perday').innerHTML =
            'You can spend <b>' + eur.format(per) + '</b> per day'
          $('lastday').textContent = 'Day ' + days
          var chart = $('chart')
          chart.innerHTML = ''
          for (var i = 0; i < days; i++) {
            var f = Math.min(1, Math.max(0, used - i))
            var c = document.createElement('div')
            c.className = 'col'
            var d = document.createElement('div')
            d.className = 'fill'
            d.style.height = f * 100 + '%'
            c.appendChild(d)
            chart.appendChild(c)
          }
          var r = $('result')
          if (used > days) {
            r.className = 'result over'
            r.textContent =
              'Over budget by ' +
              eur.format(spent - income) +
              ' — every day is used up.'
          } else {
            r.className = 'result'
            r.textContent =
              eur.format(spent) +
              ' uses up ' +
              num.format(used) +
              ' of ' +
              days +
              ' days. ' +
              eur.format(income - spent) +
              ' left.'
          }
        }
        $('income').addEventListener('input', render)
        $('days').addEventListener('input', render)
        $('spent').addEventListener('keydown', function (e) {
          if (e.key === 'Enter') {
            e.preventDefault()
            if (p($('spent').value) > 0) $('note').focus()
          }
        })
        $('note').addEventListener('keydown', function (e) {
          if (e.key === 'Enter') {
            e.preventDefault()
            add()
          }
        })
        $('add').addEventListener('click', add)
        $('reset').addEventListener('click', function () {
          entries = []
          $('spent').value = ''
          $('note').value = ''
          render()
        })
        load()
        render()
      })()
    </script>
  </body>
</html>
